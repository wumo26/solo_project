spring.application.name=quiz1150512

#修改 server 啟動的 port，預設是 8080
#server.port=8083

#設定資料庫連接
# 3306是連接 mysql 的 port；p111150512 是要連接的資料庫名稱
# rewriteBatchedStatements=true: 可以批次新增
spring.datasource.url=jdbc:mysql://localhost:3306/quiz1150512?serverTimezone=Asia/Taipei&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}

# Load local credentials from the monorepo root or backend working directory.
spring.config.import=optional:file:./config/application-local.properties,optional:file:../config/application-local.properties
