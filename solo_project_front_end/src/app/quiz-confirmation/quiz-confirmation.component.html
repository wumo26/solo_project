<div class="confirmation-container">
  <mat-card *ngIf="quiz && userAnswers">
    <mat-card-title>確認您的答案</mat-card-title>
    <mat-card-subtitle>請確認以下是您最終的答案。確認無誤後，請點擊「確認送出」。</mat-card-subtitle>

    <mat-card-content>
      <mat-list role="list">
        <!-- 使用我們在 .ts 中建立的 answerKeys 陣列來遍歷所有答案 -->
        <div *ngFor="let questionId of answerKeys">
          <mat-list-item role="listitem">
            <!-- 使用 questionMap 來顯示問題的文字 -->
            <strong>{{ questionMap.get(questionId) }}:</strong> &nbsp; {{ userAnswers[questionId] }}
          </mat-list-item>
        </div>
      </mat-list>
    </mat-card-content>

    <mat-card-actions align="end">
      <!-- 在提交期間 (isSubmitting 為 true) 禁用按鈕 -->
      <button mat-stroked-button (click)="goBack()" [disabled]="isSubmitting">返回修改</button>
      <button mat-flat-button color="primary" (click)="confirmAndSubmit()" [disabled]="isSubmitting">
        <!-- 根據 isSubmitting 的狀態，顯示不同內容 -->
        <span *ngIf="!isSubmitting">確認送出</span>
        <span *ngIf="isSubmitting">
          <!-- 提交時顯示一個小小的載入中圖示 -->
          <mat-spinner diameter="20" style="margin: 0 auto;"></mat-spinner>
        </span>
      </button>
    </mat-card-actions>
  </mat-card>

  <!-- 如果因為某些原因 (例如使用者直接輸入網址) 導致沒有問卷資料，就顯示這個提示 -->
  <div *ngIf="!quiz" class="error-message">
    <p>沒有可確認的答案。請返回問卷列表。</p>
    <a mat-button routerLink="/quiz-list">返回列表</a>
  </div>
</div>
