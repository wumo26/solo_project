<section class="public-page">
  <header class="page-header"><h1>&#20844;&#38283;&#21839;&#21367;</h1></header>
  <section class="filter-panel">
    <label><span>&#21839;&#21367;&#21517;&#31281;</span><input type="search" [(ngModel)]="titleFilter" (ngModelChange)="applyFilters()" placeholder="&#36664;&#20837;&#27161;&#38988;&#38364;&#37749;&#23383;"></label>
    <label><span>&#22635;&#23531;&#26085;&#26399;</span><input type="date" [(ngModel)]="availableDateFilter" (ngModelChange)="applyFilters()"></label>
    <button mat-button class="clear-filter-button" type="button" (click)="clearFilters()">&#28165;&#38500;&#31721;&#36984;</button>
  </section>
  <div class="table-card">
    <table mat-table [dataSource]="dataSource" class="quiz-table">
      <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>&#21839;&#21367;&#21517;&#31281;</th><td mat-cell *matCellDef="let quiz" class="quiz-title"><div class="title-line"><mat-icon *ngIf="quiz.isPinned" class="pinned-icon">push_pin</mat-icon><span>{{ quiz.title }}</span></div><small>&#24314;&#31435;&#32773;&#65306;{{ creatorName(quiz) }}</small></td></ng-container>
      <ng-container matColumnDef="startDate"><th mat-header-cell *matHeaderCellDef>&#38283;&#22987;&#26085;&#26399;</th><td mat-cell *matCellDef="let quiz">{{ quiz.startDate | date:'yyyy/MM/dd' }}</td></ng-container>
      <ng-container matColumnDef="endDate"><th mat-header-cell *matHeaderCellDef>&#32080;&#26463;&#26085;&#26399;</th><td mat-cell *matCellDef="let quiz">{{ quiz.endDate | date:'yyyy/MM/dd' }}</td></ng-container>
      <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>&#29376;&#24907;</th><td mat-cell *matCellDef="let quiz"><span class="status-badge" [class.closed]="quiz.isClosed">{{ statusLabel(quiz) }}</span></td></ng-container>
      <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>&#25805;&#20316;</th><td mat-cell *matCellDef="let quiz"><a mat-button class="view-button" [routerLink]="['/public/quiz', quiz.id]">&#26597;&#30475;&#21839;&#21367;</a></td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <p *ngIf="loading" class="message">&#36617;&#20837;&#21839;&#21367;&#20013;&#8230;</p><p *ngIf="error" class="message error">{{ error }}</p><p *ngIf="!loading && !error && !dataSource.data.length" class="message">&#30446;&#21069;&#27794;&#26377;&#31526;&#21512;&#31684;&#36984;&#30340;&#20844;&#38283;&#21839;&#21367;&#12290;</p>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</section>
