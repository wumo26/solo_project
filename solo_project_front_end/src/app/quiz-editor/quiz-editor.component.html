<div class="editor-container">
  <header class="editor-header"><h1 *ngIf="isEditMode">&#32232;&#36655;&#21839;&#21367;</h1><h1 *ngIf="!isEditMode">&#24314;&#31435;&#26032;&#21839;&#21367;</h1><div class="header-actions"><button *ngIf="isEditMode" mat-button class="cancel-button" (click)="onCancel()">&#22238;&#24489;</button><button mat-flat-button color="primary" (click)="onSave()" [disabled]="quizForm.disabled">&#20786;&#23384;&#20006;&#38928;&#35261;</button></div></header>

  <mat-card><mat-card-content><form [formGroup]="quizForm">
    <section class="form-section"><h2>&#21839;&#21367;&#22522;&#26412;&#35373;&#23450;</h2><mat-form-field appearance="outline" class="full-width"><mat-label>&#21839;&#21367;&#27161;&#38988;</mat-label><input matInput formControlName="name" required><mat-error *ngIf="quizForm.get('name')?.hasError('required')">&#35531;&#36664;&#20837;&#21839;&#21367;&#27161;&#38988;</mat-error></mat-form-field><mat-form-field appearance="outline" class="full-width"><mat-label>&#21839;&#21367;&#35498;&#26126;&#65288;&#36984;&#22635;&#65289;</mat-label><textarea matInput formControlName="description" rows="3"></textarea></mat-form-field><div class="form-row"><mat-form-field appearance="outline"><mat-label>&#38283;&#22987;&#26085;&#26399;</mat-label><input matInput [matDatepicker]="startDatePicker" formControlName="startDate" required><mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle><mat-datepicker #startDatePicker></mat-datepicker></mat-form-field><mat-form-field appearance="outline"><mat-label>&#32080;&#26463;&#26085;&#26399;</mat-label><input matInput [matDatepicker]="endDatePicker" formControlName="endDate" required><mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle><mat-datepicker #endDatePicker></mat-datepicker></mat-form-field></div></section>

      <ng-container *ngSwitchCase="'multiple-choice'"><div class="question-header"><h3>&#22810;&#36984;&#38988; {{ i + 1 }}</h3><button mat-button class="remove-button" (click)="removeQuestion(i)">&#21034;&#38500;&#38988;&#30446;</button></div><mat-form-field appearance="outline" class="full-width"><mat-label>&#38988;&#30446;&#20839;&#23481;</mat-label><input matInput formControlName="questionText"></mat-form-field><div formArrayName="options"><h4>&#36984;&#38917;</h4><div *ngFor="let option of getOptions(i).controls; let j = index" [formGroupName]="j" class="option-row"><span class="choice-mark square"></span><mat-form-field appearance="fill" class="option-input"><input matInput formControlName="optionText" placeholder="&#36984;&#38917; {{ j + 1 }}"></mat-form-field><button mat-button class="remove-button" (click)="removeOption(i, j)">&#31227;&#38500;</button></div></div><button mat-button class="add-option-button" (click)="addOption(i)">&#26032;&#22686;&#36984;&#38917;</button></ng-container>
      <ng-container *ngSwitchCase="'text-input'"><div class="question-header"><h3>&#25991;&#23383;&#38988; {{ i + 1 }}</h3><button mat-button class="remove-button" (click)="removeQuestion(i)">&#21034;&#38500;&#38988;&#30446;</button></div><mat-form-field appearance="outline" class="full-width"><mat-label>&#38988;&#30446;&#20839;&#23481;</mat-label><input matInput formControlName="questionText"></mat-form-field><p class="text-note">&#22635;&#31572;&#32773;&#23559;&#20197;&#25991;&#23383;&#22238;&#31572;&#27492;&#38988;&#12290;</p></ng-container>
    </div></div></div><p class="no-questions-prompt" *ngIf="questions.length === 0">&#23578;&#26410;&#26032;&#22686;&#38988;&#30446;&#65292;&#35531;&#24478;&#19979;&#26041;&#36984;&#25799;&#38988;&#22411;&#12290;</p><div class="add-question-actions"><button mat-button class="add-question-button" [matMenuTriggerFor]="addQuestionMenu">&#26032;&#22686;&#38988;&#30446;</button><mat-menu #addQuestionMenu="matMenu"><button mat-menu-item (click)="addQuestion('single-choice')">&#21934;&#36984;&#38988;</button><button mat-menu-item (click)="addQuestion('multiple-choice')">&#22810;&#36984;&#38988;</button><button mat-menu-item (click)="addQuestion('text-input')">&#25991;&#23383;&#38988;</button></mat-menu></div></section>
  </form></mat-card-content></mat-card>
  <div class="editor-footer"><button mat-button class="return-list-button" (click)="returnToList()">&#36820;&#22238;&#21015;&#34920;</button></div>
</div>
